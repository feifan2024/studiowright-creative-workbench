<text x="64" y="899" font-size="19" fill="#2452a4" font-weight="700">对话管理</text>
<text x="64" y="923" font-size="15" fill="#33465a" font-weight="400">原消息、回复、账号和耗时</text>
<text x="64" y="945" font-size="15" fill="#33465a" font-weight="400">后续查询或接着对话</text>
<rect x="561" y="872" width="478" height="106" rx="12" fill="#fffdf8" stroke="#e2cda7"/>
<text x="579" y="899" font-size="19" fill="#81511c" font-weight="700">任务与调度记录</text>
<text x="579" y="923" font-size="15" fill="#33465a" font-weight="400">原编号贯穿提交、尝试、失败和下载</text>
<text x="579" y="945" font-size="15" fill="#33465a" font-weight="400">任务自动更新；账号同步属于调度记录</text>
<rect x="1076" y="872" width="478" height="106" rx="12" fill="#fff" stroke="#b2d4c4"/>
<text x="1094" y="899" font-size="19" fill="#20644f" font-weight="700">素材库与下载</text>
<text x="1094" y="923" font-size="15" fill="#33465a" font-weight="400">保留原文件、来源、账号和项目</text>
<text x="1094" y="945" font-size="15" fill="#33465a" font-weight="400">按设置交 Gemini 分析，写回标签和镜头说明</text>
<path d="M1076 920 H1039" stroke="#617a92" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M1368 978 V1037 H1039" stroke="#617a92" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
