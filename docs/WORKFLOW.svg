<rect x="561" y="1021" width="478" height="47" rx="12" fill="#e8f0ff" stroke="#b9ccef"/>
<text x="580" y="1050" font-size="17" fill="#2452a4" font-weight="700">Gemini 多模态：自动分析 / 手动补打 → 写回素材库</text>
<text x="46" y="1094" font-size="17" fill="#33465a" font-weight="400">返回方式：Windows 工作台读取任务事件和状态；外部系统按原请求 / 任务编号查询或下载。</text>
</g></svg>
